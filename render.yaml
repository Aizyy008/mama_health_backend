envVarGroups:
  - name: mama-health-shared-env
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mama-health-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: mama-health-redis
          type: redis
          property: connectionString
      # The following are added manually in the Render dashboard on this
      # group once the client supplies real credentials — never committed:
      # ALLOWED_HOSTS, CORS_ALLOWED_ORIGINS, FRONTEND_URL,
      # EMAIL_HOST / EMAIL_HOST_USER / EMAIL_HOST_PASSWORD,
      # AI_PROVIDER / AI_API_KEY, WHATSAPP_API_TOKEN / WHATSAPP_PHONE_NUMBER_ID,
      # FCM_CREDENTIALS_JSON, GOOGLE_PLACES_API_KEY,
      # SEED_ADMIN_EMAIL / SEED_ADMIN_PASSWORD

services:
  - type: web
    name: mama-health-api
    env: python
    plan: starter
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVarGroups:
      - mama-health-shared-env
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod

  - type: worker
    name: mama-health-celery-worker
    env: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A config worker -l info"
    envVarGroups:
      - mama-health-shared-env
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod

  - type: worker
    name: mama-health-celery-beat
    env: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    envVarGroups:
      - mama-health-shared-env
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod

databases:
  - name: mama-health-db
    plan: starter
    postgresMajorVersion: 16

  - name: mama-health-redis
    type: redis
    plan: starter
    ipAllowList: []
