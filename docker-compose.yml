# Local development only — Render provides managed Postgres/Redis in production.
services:
  db:
    image: postgres:14-alpine
    container_name: mama_health_db
    environment:
      POSTGRES_USER: mama_health
      POSTGRES_PASSWORD: mama_health
      POSTGRES_DB: mama_health
    ports:
      - "5432:5432"
    volumes:
      - mama_health_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mama_health_redis
    ports:
      - "6380:6379"

volumes:
  mama_health_pgdata:
