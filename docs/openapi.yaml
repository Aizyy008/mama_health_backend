          maximum: 2147483647
          minimum: 0
        status:
          allOf:
          - $ref: '#/components/schemas/AppointmentStatusEnum'
          readOnly: true
        meeting_link:
          type: string
          format: uri
          readOnly: true
        reason:
          type: string
        doctor_notes:
          type: string
        cancellation_reason:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - cancellation_reason
      - created_at
      - doctor
      - id
      - meeting_link
      - patient
      - scheduled_at
      - status
      - updated_at
