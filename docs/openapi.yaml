    get:
      operationId: hospitals_nearby_list
      description: Live proxy to Google Places Nearby Search — results are **not**
        stored in our own database, this always reflects Google's current data (Redis-cached
        for up to `HOSPITAL_CACHE_TTL_SECONDS`, default 1h, by rounded lat/lng so
        GPS jitter doesn't cost an extra API call). `lat`/`lng` are query params (patient's
        current GPS position), `radius` is in meters (default 5000, max 50000). Returns
        `503` (not a raw error) if `GOOGLE_PLACES_API_KEY` isn't configured yet or
        the upstream call fails — show the frontend a friendly 'hospital search unavailable'
        state on 503, it isn't a client bug.
      summary: Find nearby hospitals
      parameters:
      - in: query
        name: lat
        schema:
          type: number
          format: double
          maximum: 90
          minimum: -90
        required: true
      - in: query
        name: lng
        schema:
          type: number
          format: double
          maximum: 180
          minimum: -180
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: radius
        schema:
          type: integer
          maximum: 50000
          minimum: 100
          default: 5000
      tags:
      - Hospitals
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHospitalList'
              examples:
                200OK:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - - place_id: ChIJ_abc123
                        name: City Maternity Hospital
                        address: 123 Main St, Karachi
                        latitude: 24.8607
                        longitude: 67.0099
                        rating: 4.2
                        is_open_now: true
                  summary: 200 OK
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
              examples:
                503NotConfigured/UpstreamFailure:
                  value:
                    detail: Hospital search hasn't been configured yet. Please try
                      again later.
                    errors: null
                  summary: 503 Not configured / upstream failure
          description: ''
