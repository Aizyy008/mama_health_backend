  /api/v1/appointments/{id}/status/:
    post:
      operationId: appointments_status_create
      description: 'State machine, enforced server-side — invalid transitions return
        400: `pending → confirmed | cancelled`, `confirmed → completed | cancelled
        | no_show`. `completed`/`cancelled`/`no_show` are terminal (no further transitions).
        `cancellation_reason` is only used/stored when `status=cancelled`. Notifies
        whichever party didn''t make the change (or both, if an admin made it).'
      summary: Change appointment status
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this appointment.
        required: true
      tags:
      - Appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentStatusUpdateRequest'
            examples:
              Request—Confirm:
                value:
                  status: confirmed
                summary: Request — confirm
              Request—Cancel:
                value:
                  status: cancelled
                  cancellation_reason: Patient has a scheduling conflict
                summary: Request — cancel
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppointmentStatusUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppointmentStatusUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
              examples:
                200OK:
                  value:
                    id: 15
                    patient:
                      id: 2
                      email: sara.ahmed@example.com
                      first_name: Sara
                      last_name: Ahmed
                    doctor:
                      id: 4
                      email: dr.ayesha@example.com
                      first_name: Ayesha
                      last_name: Malik
                    appointment_type: in_person
                    scheduled_at: '2026-08-05T10:30:00Z'
                    duration_minutes: 30
                    status: pending
                    meeting_link: ''
                    reason: Routine 20-week checkup
                    doctor_notes: ''
                    cancellation_reason: ''
                    created_at: '2026-07-29T14:00:00Z'
                    updated_at: '2026-07-29T14:00:00Z'
                  summary: 200 OK
          description: ''
        '400':
