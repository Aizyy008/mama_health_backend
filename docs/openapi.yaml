openapi: 3.0.3
info:
  title: Mama Health API
  version: 1.0.0
  description: REST API for the Mama Health pregnancy care platform. Serves the Patient,
    Doctor, and Admin (Flutter Web) clients.
paths:
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: Public, patient-only self-registration. Always creates a `role=patient`
        account regardless of anything else in the payload — doctors and admins are
        never created this way (see Doctor Invite / seed_admin). Sends a verification
        email; the account cannot log in until `verify-email/` is called with the
        code from that email.
      summary: Register a new patient
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              Request:
                value:
                  email: sara.ahmed@example.com
                  password: StrongPass123!
                  first_name: Sara
                  last_name: Ahmed
                  phone_number: '+923001234567'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
              examples:
                201Created:
                  value:
                    detail: Registration successful. Check your email to verify your
                      account.
                  summary: 201 Created
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
              examples:
                400EmailAlreadyRegistered:
                  value:
                    detail: An account with this email already exists. Please log
                      in or use a different email.
                    errors:
                      email:
                      - An account with this email already exists. Please log in or
                        use a different email.
                  summary: 400 Email already registered
          description: ''
  /api/v1/auth/verify-email/:
    post:
      operationId: auth_verify_email_create
      description: Consumes the 6-digit OTP code emailed to the patient on registration
        — a code, not a link, since patients are mobile-app-only and an emailed https://
        link just opens a browser, not the app, without real deep-link setup. Only
        the most recently requested code is valid (requesting a new one via `resend-verification/`
        invalidates any previous unused code). Expires after `EMAIL_VERIFICATION_TOKEN_EXPIRY_HOURS`
        (default 48h).
      summary: Verify email with a code
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
            examples:
              Request:
                value:
                  email: sara.ahmed@example.com
                  otp_code: '482913'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
              examples:
                200OK:
                  value:
                    detail: Email verified. You can now log in.
                  summary: 200 OK
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
              examples:
                400Invalid/expiredCode:
                  value:
                    detail: This code has expired. Please request a new one.
                    errors: null
                  summary: 400 Invalid/expired code
          description: ''
  /api/v1/auth/resend-verification/:
    post:
      operationId: auth_resend_verification_create
      description: Re-issues a fresh verification code/email for an unverified account
        (invalidates any previous unused code). Always returns 200 with the same generic
        message whether or not the email exists/is already verified — this is intentional
        (does not leak account existence), so don't treat the response body as confirmation
        the email was actually sent.
      summary: Resend the verification email
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
            examples:
              Request:
                value:
                  email: sara.ahmed@example.com
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendVerification'
              examples:
                200OK:
                  value:
                    detail: If that account exists and is unverified, a new email
                      has been sent.
                  summary: 200 OK
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: 'Returns `access` (short-lived, default 30 min — send as `Authorization:
        Bearer <access>` on every subsequent request) and `refresh` (default 14 days
        — use at `/token/refresh/` to get a new access token without re-entering credentials).
        `role` and `user_id` are also echoed at the top level for convenience, and
        `role`/`is_email_verified`/`email` are embedded as claims inside the access
        token itself if you need to read them client-side without a round trip. Blocks
        unverified patients and deactivated accounts.'
      summary: Login (obtain JWT access + refresh tokens)
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MamaHealthTokenObtainPairRequest'
            examples:
              Request:
                value:
                  email: sara.ahmed@example.com
                  password: StrongPass123!
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MamaHealthTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MamaHealthTokenObtainPairRequest'
        required: true
      responses:
        '200':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
              examples:
                401WrongCredentials:
                  value:
                    detail: Please enter a valid email and password.
                  summary: 401 Wrong credentials
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
              examples:
                400UnverifiedEmail:
                  value:
                    detail: Please verify your email before logging in.
                    errors: null
                  summary: 400 Unverified email
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: Exchange a still-valid `refresh` token for a new `access` token.
        Refresh tokens rotate on use (`ROTATE_REFRESH_TOKENS=True`) and the old one
        is blacklisted — always store and use the newest `refresh` value returned.
      summary: Refresh an access token
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
            examples:
              Request:
                value:
                  refresh: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
              examples:
                200OK:
                  value:
                    access: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    refresh: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  summary: 200 OK
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Blacklists the given refresh token so it can no longer be used
        to obtain new access tokens. The frontend should also discard both tokens
        locally. This does not invalidate an already-issued access token before its
        natural expiry (default 30 min).
      summary: Logout (blacklist refresh token)
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
            examples:
              Request:
                value:
                  refresh: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/password/forgot/:
    post:
      operationId: auth_password_forgot_create
      description: 'Emails a 6-digit OTP code (expires after `PASSWORD_RESET_OTP_EXPIRY_MINUTES`,
        default 10 min) if the account exists. Always returns 200 with the same message
        regardless — does not leak account existence. Next step: `POST /auth/password/verify-otp/`
        with the code from the email.'
      summary: Request a password reset code (step 1 of 3)
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordForgotRequest'
            examples:
              Request:
                value:
                  email: sara.ahmed@example.com
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordForgotRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordForgotRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordForgot'
              examples:
                200OK:
                  value:
                    detail: If that account exists, a password reset code has been
                      sent.
                  summary: 200 OK
          description: ''
  /api/v1/auth/password/verify-otp/:
    post:
      operationId: auth_password_verify_otp_create
      description: Checks the emailed OTP code. On success, returns a `reset_token`
        to use with `POST /auth/password/reset/` (step 3) — the frontend doesn't need
        to resubmit the code again there. The code is single-use and only the most
        recently requested one is valid.
      summary: Verify the password reset code (step 2 of 3)
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordVerifyOTPRequest'
            examples:
              Request:
                value:
                  email: sara.ahmed@example.com
                  otp_code: '482913'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordVerifyOTPRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordVerifyOTPRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordVerifyOTPResponse'
              examples:
                200OK:
                  value:
                    detail: Code verified.
                    reset_token: 8fK2mZ...reset-token...
                  summary: 200 OK
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
              examples:
                400Invalid/expiredCode:
                  value:
                    detail: This code has expired. Please request a new one.
                    errors: null
                  summary: 400 Invalid/expired code
          description: ''
  /api/v1/auth/password/reset/:
    post:
      operationId: auth_password_reset_create
      description: Consumes the single-use `reset_token` returned by `POST /auth/password/verify-otp/`.
        Token expires after `PASSWORD_RESET_TOKEN_EXPIRY_HOURS` (default 2h).
      summary: Reset password with token (step 3 of 3)
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            examples:
              Request:
                value:
                  token: 8fK2mZ...reset-token...
                  new_password: NewStrongPass123!
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
              examples:
                200OK:
                  value:
                    detail: Password reset successful. You can now log in.
                  summary: 200 OK
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
              examples:
                400Invalid/expiredToken:
                  value:
                    detail: Reset token has expired. Please request a new one.
                    errors: null
                  summary: 400 Invalid/expired token
          description: ''
  /api/v1/auth/password/change/:
    post:
      operationId: auth_password_change_create
      description: 'Requires the current password. Authenticated via the normal `Authorization:
        Bearer <access>` header — no separate token.'
      summary: Change password (authenticated)
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            examples:
              Request:
                value:
                  old_password: StrongPass123!
                  new_password: EvenStrongerPass456!
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
              examples:
                200OK:
                  value:
                    detail: Password changed successfully.
                  summary: 200 OK
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
              examples:
                400WrongOldPassword:
                  value:
                    detail: The old password you entered is incorrect. Please try
                      again.
                    errors:
                      old_password:
                      - The old password you entered is incorrect. Please try again.
                  summary: 400 Wrong old password
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Returns the authenticated user plus whichever of `patient_profile`/`doctor_profile`
        applies (the other is always `null`). Use `patient_profile.profile_complete`
        to decide whether to route a patient to the 'complete your profile' screen
        after login. Works for all three roles — for an Admin, both nested profiles
        are always `null`.
      summary: Get the current user
      tags:
      - Auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                200OK—Patient:
                  value:
                    id: 2
                    email: sara.ahmed@example.com
                    role: patient
                    first_name: Sara
                    last_name: Ahmed
                    phone_number: '+923001234567'
                    is_email_verified: true
                    date_joined: '2026-01-15T10:30:00Z'
                    patient_profile:
                      date_of_birth: '1995-06-20'
                      lmp_date: '2026-05-01'
                      edd_date: null
                      blood_group: O+
                      emergency_contact_name: Ahmed Khan
                      emergency_contact_phone: '+923001112222'
                      address: House 12, Street 5, Karachi
                      profile_complete: true
                    doctor_profile: null
                  summary: 200 OK — patient
          description: ''
    patch:
      operationId: auth_me_partial_update
      description: Updates `first_name`/`last_name`/`phone_number` only — email, role,
        and verification status are never editable here. For patient-specific fields
        (LMP date, blood group, etc.) or doctor-specific fields (specialization, license),
        use `/accounts/me/patient-profile/` or `/accounts/me/doctor-profile/` instead.
        Works for all three roles, including Admin.
      summary: Update the current user's profile
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdateRequest'
            examples:
              Request:
                value:
                  first_name: Sara
                  last_name: Ahmed
                  phone_number: '+923001234567'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeUpdate'
          description: ''
  /api/v1/accounts/doctors/invite/:
    post:
      operationId: accounts_doctors_invite_create
      description: Admin-only. Creates a pending `DoctorInvite` and emails an accept
        link (`{FRONTEND_URL}/doctor-invite?token=...`) to `email`. This is the **only**
        way a doctor account gets created — there is no public doctor self-registration.
        The invite expires after `DOCTOR_INVITE_EXPIRY_DAYS` (default 7 days) if never
        accepted.
      summary: Invite a doctor (admin only)
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoctorInviteRequest'
            examples:
              Request:
                value:
                  email: dr.ayesha@example.com
                  specialization: OB-GYN
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DoctorInviteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DoctorInviteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
              examples:
                201Created:
                  value:
                    detail: Invite sent.
                  summary: 201 Created
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
              examples:
                400AlreadyExists/Pending:
                  value:
                    detail: A user with this email already exists. Please use a different
                      email address.
                    errors:
                      email:
                      - A user with this email already exists. Please use a different
                        email address.
                  summary: 400 Already exists / pending
          description: ''
  /api/v1/accounts/doctors/invite/accept/:
    post:
      operationId: accounts_doctors_invite_accept_create
      description: Public (no auth) — the doctor reaches this via the 6-digit OTP
        code emailed to them (a code, not a link, since the doctor app is mobile-only).
        Sets the doctor's password and activates the account. Unlike patient registration,
        this account is **immediately email-verified** (entering the invite code already
        proves ownership) and can log in right away.
      summary: Accept a doctor invite
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoctorInviteAcceptRequest'
            examples:
              Request:
                value:
                  email: dr.ayesha@example.com
                  otp_code: '482913'
                  password: DoctorPass123!
                  first_name: Ayesha
                  last_name: Malik
                  phone_number: '+923009876543'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DoctorInviteAcceptRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DoctorInviteAcceptRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
              examples:
                201Created:
                  value:
                    detail: Account activated. You can now log in.
                  summary: 201 Created
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
              examples:
                400Invalid/expiredInvite:
                  value:
                    detail: This invite has expired. Ask an admin to send a new one.
                    errors: null
                  summary: 400 Invalid/expired invite
          description: ''
  /api/v1/accounts/me/patient-profile/:
    get:
      operationId: accounts_me_patient_profile_retrieve
      description: Patient-only. `GET` returns the current profile (auto-created empty
        on first access); `PATCH` updates any subset of fields. `profile_complete`
        is read-only and server-computed (true once both `date_of_birth` and `lmp_date`
        are set) — don't attempt to set it directly.
      summary: View/update my patient profile
      tags:
      - Accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientProfile'
              examples:
                200OK:
                  value:
                    date_of_birth: '1995-06-20'
                    lmp_date: '2026-05-01'
                    edd_date: null
                    blood_group: O+
                    emergency_contact_name: Ahmed Khan
                    emergency_contact_phone: '+923001112222'
                    address: House 12, Street 5, Karachi
                    profile_complete: true
                  summary: 200 OK
          description: ''
    put:
      operationId: accounts_me_patient_profile_update
      description: Patient-only. `GET` returns the current profile (auto-created empty
        on first access); `PATCH` updates any subset of fields. `profile_complete`
        is read-only and server-computed (true once both `date_of_birth` and `lmp_date`
        are set) — don't attempt to set it directly.
      summary: View/update my patient profile
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientProfileRequest'
            examples:
              PATCHRequest:
                value:
                  date_of_birth: '1995-06-20'
                  lmp_date: '2026-05-01'
                  blood_group: O+
                  emergency_contact_name: Ahmed Khan
                  emergency_contact_phone: '+923001112222'
                  address: House 12, Street 5, Karachi
                summary: PATCH request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatientProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatientProfileRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientProfile'
              examples:
                200OK:
                  value:
                    date_of_birth: '1995-06-20'
                    lmp_date: '2026-05-01'
                    edd_date: null
                    blood_group: O+
                    emergency_contact_name: Ahmed Khan
                    emergency_contact_phone: '+923001112222'
                    address: House 12, Street 5, Karachi
                    profile_complete: true
                  summary: 200 OK
          description: ''
    patch:
      operationId: accounts_me_patient_profile_partial_update
      description: Patient-only. `GET` returns the current profile (auto-created empty
        on first access); `PATCH` updates any subset of fields. `profile_complete`
        is read-only and server-computed (true once both `date_of_birth` and `lmp_date`
        are set) — don't attempt to set it directly.
      summary: View/update my patient profile
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPatientProfileRequest'
            examples:
              PATCHRequest:
                value:
                  date_of_birth: '1995-06-20'
                  lmp_date: '2026-05-01'
                  blood_group: O+
                  emergency_contact_name: Ahmed Khan
                  emergency_contact_phone: '+923001112222'
                  address: House 12, Street 5, Karachi
                summary: PATCH request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPatientProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPatientProfileRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientProfile'
              examples:
                200OK:
                  value:
                    date_of_birth: '1995-06-20'
                    lmp_date: '2026-05-01'
                    edd_date: null
                    blood_group: O+
                    emergency_contact_name: Ahmed Khan
                    emergency_contact_phone: '+923001112222'
                    address: House 12, Street 5, Karachi
                    profile_complete: true
                  summary: 200 OK
          description: ''
  /api/v1/accounts/me/doctor-profile/:
    get:
      operationId: accounts_me_doctor_profile_retrieve
      description: Doctor-only. `GET` returns the current profile (auto-created empty
        on first access); `PATCH` updates any subset of fields.
      summary: View/update my doctor profile
      tags:
      - Accounts
      security:
      - jwtAuth: []
