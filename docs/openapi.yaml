          type: array
          items:
            $ref: '#/components/schemas/RecentActivity'
      required:
      - active_sos_events
      - appointments_this_month
      - new_patients_this_week
      - recent_activities
      - today_appointments
      - total_appointments
      - total_doctors
      - total_patients
      - trimester_distribution
