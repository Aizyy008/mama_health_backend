  /api/v1/appointments/:
    post:
      operationId: appointments_create
      description: |-
        Scoping is bespoke (not PatientScopedQuerysetMixin): an appointment has
        two distinct parties, so a doctor's view must be `doctor=request.user`,
        not "any patient this doctor is assigned to" (which would leak other
        doctors' appointments with a shared patient).
      tags:
      - Appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
    get:
      operationId: appointments_list
      description: |-
        Scoping is bespoke (not PatientScopedQuerysetMixin): an appointment has
        two distinct parties, so a doctor's view must be `doctor=request.user`,
        not "any patient this doctor is assigned to" (which would leak other
        doctors' appointments with a shared patient).
      parameters:
