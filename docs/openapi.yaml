  /api/v1/reports/search/:
    get:
      operationId: reports_search_retrieve
      description: Simple case-insensitive substring match — not full-text search.
        Doctors/patients matched by name or email; appointments matched by patient/doctor
        name-or-email or the free-text `reason` field. Each category capped at 10
        results; not paginated.
      summary: Global search across doctors, patients, and appointments (admin only)
      parameters:
      - in: query
        name: q
        schema:
          type: string
        description: Search term, minimum 2 characters.
        required: true
      tags:
      - Reports
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResults'
              examples:
                200OK:
                  value:
                    doctors:
                    - id: 4
                      email: dr.ayesha@example.com
                      first_name: Ayesha
                      last_name: Malik
                      phone_number: '+923009876543'
                      is_active: true
                      date_joined: '2026-01-10T09:00:00Z'
                      doctor_profile:
                        specialization: OB-GYN
                        license_number: PMC-12345
                        years_of_experience: 8
                        bio: ''
                        is_accepting_patients: true
                    patients: []
                    appointments: []
                  summary: 200 OK
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
              examples:
                400QueryTooShort:
                  value:
                    detail: Search term must be at least 2 characters.
                    errors: null
                  summary: 400 Query too short
          description: ''
  /api/v1/emergency/sos/:
    get:
      operationId: emergency_sos_list
      description: 'Role-scoped: patient''s own; assigned doctor''s/admin''s view
        (admin can also narrow to one patient with `?patient_id=`). Filter to just
        active events with `?status=active`.'
      summary: List SOS events
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
        description: 'Filter by status: active, resolved, or false_alarm.'
      tags:
      - Emergency
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEmergencySOSEventList'
              examples:
                200OK:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - count: 1
                      next: null
                      previous: null
                      results:
                      - id: 3
                        patient:
                          id: 2
                          email: sara.ahmed@example.com
                          first_name: Sara
                          last_name: Ahmed
                        latitude: '24.860700'
                        longitude: '67.009900'
                        status: active
                        resolved_at: null
                        notes: ''
                        created_at: '2026-07-29T16:00:00Z'
                  summary: 200 OK
          description: ''
    post:
      operationId: emergency_sos_create
      description: '**Patient-only** — unlike every other clinical endpoint, a doctor/admin
        can never trigger this on a patient''s behalf (403 for them), since it doesn''t
        make sense for anyone but the patient in distress to raise it. `latitude`/`longitude`
        are optional but strongly recommended (GPS coordinates at the moment of triggering).
        On creation, a Celery task immediately fans out a notification (push + WhatsApp)
        to every doctor assigned to this patient and all active admins, plus a direct
        WhatsApp message to the patient''s `emergency_contact_phone` if one is set
        on their profile — none of that blocks this request, which returns as soon
        as the event row is created.'
      summary: Trigger an emergency SOS
      tags:
      - Emergency
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmergencySOSEventRequest'
            examples:
              Request:
                value:
                  latitude: 24.8607
                  longitude: 67.0099
                  notes: Severe abdominal pain
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmergencySOSEventRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmergencySOSEventRequest'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmergencySOSEvent'
              examples:
                201Created:
                  value:
                    id: 3
                    patient:
                      id: 2
                      email: sara.ahmed@example.com
                      first_name: Sara
                      last_name: Ahmed
                    latitude: '24.860700'
                    longitude: '67.009900'
                    status: active
                    resolved_at: null
                    notes: ''
                    created_at: '2026-07-29T16:00:00Z'
                  summary: 201 Created
          description: ''
  /api/v1/emergency/sos/{id}/:
    get:
      operationId: emergency_sos_retrieve
      description: |-
        SOS is inherently patient-initiated — unlike other clinical models, a
        doctor/admin can never trigger one 'on behalf of' a patient, only read
        and resolve them.
      summary: Get a single SOS event
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this emergency sos event.
        required: true
      tags:
      - Emergency
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmergencySOSEvent'
              examples:
                200OK:
                  value:
                    id: 3
                    patient:
                      id: 2
                      email: sara.ahmed@example.com
                      first_name: Sara
                      last_name: Ahmed
                    latitude: '24.860700'
                    longitude: '67.009900'
                    status: active
                    resolved_at: null
                    notes: ''
                    created_at: '2026-07-29T16:00:00Z'
                  summary: 200 OK
          description: ''
  /api/v1/emergency/sos/{id}/resolve/:
    post:
      operationId: emergency_sos_resolve_create
      description: Patient (their own, e.g. to cancel an accidental trigger), assigned
        doctor, or admin. `status` must be `resolved` or `false_alarm` — `active`
        is only ever set at creation.
      summary: Resolve or dismiss an SOS event
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this emergency sos event.
        required: true
      tags:
      - Emergency
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveSOSRequest'
            examples:
              Request—FalseAlarm:
                value:
                  status: false_alarm
                summary: Request — false alarm
              Request—Resolved:
                value:
                  status: resolved
                summary: Request — resolved
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResolveSOSRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResolveSOSRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmergencySOSEvent'
              examples:
                200OK:
                  value:
                    id: 3
                    patient:
                      id: 2
                      email: sara.ahmed@example.com
                      first_name: Sara
                      last_name: Ahmed
                    latitude: '24.860700'
                    longitude: '67.009900'
                    status: resolved
                    resolved_at: '2026-07-29T16:20:00Z'
                    notes: ''
                    created_at: '2026-07-29T16:00:00Z'
                  summary: 200 OK
          description: ''
