        returns `202 Accepted` immediately, before delivery actually happens, so don''t
        expect the notifications to exist yet the instant this call returns. `target_role`
        is optional: omit it (or send `null`) to reach both patients and doctors;
        set `"patient"` or `"doctor"` to target just one role. Admins themselves are
        never included.'
